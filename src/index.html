<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data: blob:; media-src 'self' file: blob:; connect-src 'self'; object-src 'none'; base-uri 'self';"
    >
    <title>Local Player</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Sidebar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">LP</div>
          <div>
            <strong>Local Player</strong>
            <span>Lossless workspace</span>
          </div>
        </div>

        <label class="search-field sidebar-search">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m16.5 16.5 4 4"></path>
          </svg>
          <input id="globalSearch" type="search" placeholder="Search library" spellcheck="false" autocomplete="off">
        </label>

        <button class="sidebar-primary-action" id="sidebarScan" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 6.5A2.5 2.5 0 0 1 5.5 4H10l2 2h6.5A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-10Z"></path>
            <path d="M12 11v5M9.5 13.5h5"></path>
          </svg>
          <span>Scan Music Folder</span>
        </button>

        <nav class="sidebar-nav" aria-label="Application sections">
          <section class="nav-group">
            <h2>Library</h2>
            <button class="nav-item" type="button" data-view="albums">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="M9 9h6v6H9z"></path></svg>
              <span>Albums</span>
            </button>
            <button class="nav-item" type="button" data-view="artists">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"></path><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
              <span>Artists</span>
            </button>
            <button class="nav-item" type="button" data-view="tracks">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l10-2v13"></path><path d="M9 18a3 3 0 1 1-3-3 3 3 0 0 1 3 3ZM19 16a3 3 0 1 1-3-3 3 3 0 0 1 3 3Z"></path></svg>
              <span>Tracks</span>
            </button>
            <button class="nav-item" type="button" data-view="genres">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-9"></path><path d="M4 10l8-7 8 7"></path><path d="M9 21v-7h6v7"></path></svg>
              <span>Genres</span>
            </button>
            <button class="nav-item" type="button" data-view="composers">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 18V5l10-2v13"></path><path d="M8 18a3 3 0 1 1-3-3 3 3 0 0 1 3 3Z"></path><path d="M13 8h5"></path></svg>
              <span>Composers</span>
            </button>
            <button class="nav-item" type="button" data-view="years">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v4M17 3v4"></path><rect x="4" y="5" width="16" height="16" rx="3"></rect><path d="M4 10h16"></path></svg>
              <span>Years</span>
            </button>
          </section>

          <section class="nav-group">
            <h2>Collection</h2>
            <button class="nav-item" type="button" data-view="recentlyAdded">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8v5l3 2"></path><circle cx="12" cy="12" r="9"></circle></svg>
              <span>Recently Added</span>
            </button>
            <button class="nav-item" type="button" data-view="recentlyPlayed">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path><path d="M10 8v8l6-4-6-4Z"></path></svg>
              <span>Recently Played</span>
            </button>
            <button class="nav-item" type="button" data-view="favorites">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-4.35-9.2-8.45C1 9.2 3.3 5 7.1 5c2.1 0 3.6 1.2 4.9 2.7C13.3 6.2 14.8 5 16.9 5c3.8 0 6.1 4.2 4.3 7.55C19 16.65 12 21 12 21Z"></path></svg>
              <span>Favorites</span>
            </button>
            <button class="nav-item" type="button" data-view="playlists">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"></path><path d="M4 6h.01M4 12h.01M4 18h.01"></path></svg>
              <span>Playlists</span>
            </button>
          </section>

          <section class="nav-group">
            <h2>Tools</h2>
            <button class="nav-item" type="button" data-view="health">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14h4l2-8 4 14 2-6h4"></path><path d="M4 20h16"></path></svg>
              <span>Library Health</span>
            </button>
            <button class="nav-item" type="button" data-view="duplicates">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"></path></svg>
              <span>Duplicates</span>
            </button>
            <button class="nav-item" type="button" data-view="replayGain">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18V8M8 18V5M12 18v-8M16 18V6M20 18v-5"></path></svg>
              <span>ReplayGain</span>
            </button>
            <button class="nav-item" type="button" data-view="scanner">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4H10l2 2h6.5A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-10Z"></path><path d="M8 13h8"></path></svg>
              <span>File Scanner</span>
            </button>
          </section>

          <section class="nav-group">
            <h2>Settings</h2>
            <button class="nav-item" type="button" data-view="general">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"></path><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 0 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1A2 2 0 0 1 4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1A2 2 0 0 1 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3h.1a1.7 1.7 0 0 0 1-1.6V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.6h.1a1.7 1.7 0 0 0 1.9-.3l.1-.1A2 2 0 0 1 19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.6 1h.1a2 2 0 0 1 0 4H21a1.7 1.7 0 0 0-1.6 1Z"></path></svg>
              <span>General</span>
            </button>
            <button class="nav-item" type="button" data-view="activation">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 7a4 4 0 1 0-3.5 3.96L4 18.5V21h2.5l1.5-1.5H10v-2h2v-2h2l3.04-3.04A4 4 0 0 0 15 7Z"></path><path d="M15 7h.01"></path></svg>
              <span>Activation</span>
            </button>
            <button class="nav-item" type="button" data-view="audio">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"></path></svg>
              <span>Audio</span>
            </button>
            <button class="nav-item" type="button" data-view="backups">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><rect x="4" y="17" width="16" height="4" rx="1.5"></rect></svg>
              <span>Backups</span>
            </button>
            <button class="nav-item" type="button" data-view="advanced">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path><path d="M8 5v4M16 10v4M11 15v4"></path></svg>
              <span>Advanced</span>
            </button>
          </section>
        </nav>
      </aside>

      <main class="workspace" aria-label="Workspace">
        <header class="topbar">
          <div class="topbar-title">
            <button class="icon-button topbar-back" id="backButton" type="button" aria-label="Back" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6 9 12l6 6"></path><path d="M10 12h10"></path></svg>
            </button>
            <div>
              <h1 id="viewTitle">Albums</h1>
              <p id="viewSubtitle">Ready to scan your library</p>
            </div>
          </div>
          <div class="topbar-controls" id="topbarControls"></div>
        </header>

        <section class="view-root" id="viewRoot" tabindex="-1" aria-live="polite"></section>
      </main>

      <aside class="now-panel" aria-label="Now Playing">
        <header class="panel-heading">
          <div>
            <span>Now Playing</span>
            <h2 id="nowPanelHeading">No track selected</h2>
          </div>
          <button class="icon-button" id="panelFavorite" type="button" aria-label="Favorite">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-4.35-9.2-8.45C1 9.2 3.3 5 7.1 5c2.1 0 3.6 1.2 4.9 2.7C13.3 6.2 14.8 5 16.9 5c3.8 0 6.1 4.2 4.3 7.55C19 16.65 12 21 12 21Z"></path></svg>
          </button>
        </header>

        <div class="panel-cover" id="panelCover">LP</div>

        <section class="panel-track">
          <h3 id="panelTitle">No track selected</h3>
          <p id="panelArtist">Scan or open music to begin.</p>
          <p id="panelAlbum"></p>
          <span class="quality-badge" id="panelQuality">Ready</span>
        </section>

        <div class="mini-progress">
          <span id="panelCurrentTime">0:00</span>
          <div class="mini-progress-line"><span id="panelProgressFill"></span></div>
          <span id="panelDuration">0:00</span>
        </div>

        <div class="panel-tabs" role="tablist" aria-label="Now playing details">
          <button class="active" type="button" data-panel-tab="info">Info</button>
          <button type="button" data-panel-tab="lyrics">Lyrics</button>
        </div>

        <div class="panel-tab-body" id="panelTabBody"></div>

        <button class="secondary-action full-width" id="showCurrentInFinder" type="button">Show in Finder</button>

        <section class="health-mini-card">
          <div>
            <span>Library Health</span>
            <strong id="miniHealthScore">Needs scan</strong>
          </div>
          <button type="button" data-jump-view="health">Review</button>
        </section>
      </aside>

      <section class="player-bar" aria-label="Player">
        <div class="player-track">
          <div class="player-cover" id="barCover">LP</div>
          <div class="player-copy">
            <strong id="barTitle">No track selected</strong>
            <span id="barArtist">Ready</span>
          </div>
          <span class="quality-badge" id="barQuality">Ready</span>
        </div>

        <div class="player-center">
          <div class="transport">
            <button class="icon-button" id="shuffleButton" type="button" aria-label="Shuffle">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5M4 7h3c2.5 0 4 2 5.5 5S15.5 17 18 17h3M21 17l-5-5M4 17h3c1.2 0 2.2-.5 3-1.3"></path></svg>
            </button>
            <button class="icon-button" id="previousButton" type="button" aria-label="Previous">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M19 6 9 12l10 6V6Z"></path></svg>
            </button>
            <button class="icon-button play-toggle" id="playPauseButton" type="button" aria-label="Play">
              <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7L8 5Z"></path></svg>
              <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5h3v14H8zM13 5h3v14h-3z"></path></svg>
            </button>
            <button class="icon-button" id="nextButton" type="button" aria-label="Next">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M5 6l10 6-10 6V6Z"></path></svg>
            </button>
            <button class="icon-button" id="repeatButton" type="button" aria-label="Repeat">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"></path></svg>
            </button>
          </div>
          <div class="timeline-row">
            <span id="currentTime">0:00</span>
            <input id="seekInput" class="seek-input" type="range" min="0" max="1000" value="0" aria-label="Seek">
            <span id="durationTime">0:00</span>
          </div>
        </div>

        <div class="player-output">
          <span class="output-badge" id="outputStatus">System Output</span>
          <button class="icon-button" id="queueButton" type="button" aria-label="Queue">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"></path><path d="M4 6h.01M4 12h.01M4 18h.01"></path></svg>
          </button>
          <label class="volume-control" aria-label="Volume">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path></svg>
            <input id="volumeInput" type="range" min="0" max="1" step="0.01" value="0.8">
          </label>
        </div>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <audio id="audio"></audio>
    <script src="./renderer.js"></script>
  </body>
</html>
